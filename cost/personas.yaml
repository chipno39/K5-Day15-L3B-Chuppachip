# Mô phỏng chi phí khi dùng thật — Phạm Văn Chiêu phụ trách (guide bước 4.2).
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
  low: 300
  base: 700
  high: 1000
  source: "Track A — Quy mô lớp L3 hơn 700 học viên (theo README hackathon). Mức thấp 300 (học viên hoạt động thường xuyên), cơ sở 700 (toàn bộ học viên khoá), cao 1000 (ước tính khi mở rộng các khoá kế tiếp)."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.5              # tỉ lệ người dùng kiểu này
    uses_per_month: 4       # số phiên / người / tháng
    turns_per_session: 1    # số lượt hỏi trong một phiên
    source: "Phỏng vấn P1, P3 — học viên có nền tảng tốt, chỉ hỏi 1 lượt khi gặp định nghĩa khó hiểu."
  - name: dung_vua
    share: 0.3
    uses_per_month: 10
    turns_per_session: 3
    source: "Khảo sát học viên L3 và phân tích dữ liệu hỏi đáp pre-class trung bình 2-3 bài/tuần."
  - name: dung_nhieu
    share: 0.2
    uses_per_month: 20
    turns_per_session: 5
    source: "Phỏng vấn P4 và khai thác data/preclass: nhóm học viên đi làm tự học đêm (20h–02h), hỏi nhiều lượt để kiểm chứng bài trắc nghiệm."

prices:             # USD / 1 triệu token — chép từ bảng giá chính thức. ≥2 mức model
  - model: gemini-2.5-flash
    input: 0.075
    output: 0.30
    source: "Google AI Studio Pricing (https://ai.google.dev/pricing) · cập nhật 27/11/2026."
  - model: gemini-1.5-flash
    input: 0.075
    output: 0.30
    source: "Google AI Studio Pricing (https://ai.google.dev/pricing) · cập nhật 27/11/2026."
  - model: gemini-1.5-pro
    input: 1.25
    output: 5.00
    source: "Google AI Studio Pricing (https://ai.google.dev/pricing) · cập nhật 27/11/2026."

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate: 25400
  source: "Tỷ giá tham chiếu Vietcombank ngày 27/11/2026."
